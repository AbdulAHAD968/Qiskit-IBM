            - generic [ref=f7e106]: The circuit, as you scroll
            - heading "210 plans, all equally likely" [level=2] [ref=f7e107]
            - paragraph [ref=f7e108]: "Ten qubits, one per relative, start in the Dicke state: every way to spend exactly four kits, with the same amplitude. Each bar is one plan, from the worst on the left to the best on the right."
          - generic:
            - generic: Cost layer
            - heading "The phase turns, the heights stay" [level=2]
            - paragraph: One ZZ rotation per couple link and one Z rotation per relative. No plan becomes more likely yet. Each one's phase turns by an amount set by its value, so the colours fan out from worst to best.
          - generic:
            - generic: Mixer
            - heading "Phase becomes probability" [level=2]
            - paragraph: XX+YY rotations swap a tested and an untested relative, so plans one swap apart interfere. Good plans grow and bad ones shrink, and the number of kits never changes.
          - generic:
            - generic: Layers two and three
            - heading "Each layer sharpens the plan" [level=2]
            - paragraph: The same two steps repeat with their own angles, tuned by COBYLA on the Qiskit Estimator. Watch the chance of the best plan rise from 0.48% at the start.
          - generic:
            - generic: Measurement
            - heading "One shot in twelve is the best plan" [level=2]
            - paragraph: After three layers a single shot is the best plan 8.31% of the time, 17 times a random pick, and every shot uses exactly four kits. The best of the measured plans goes to the field officer.
